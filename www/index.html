<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شطرنج</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

:root{
  --bg:#100a10;--panel:#1e0f1e;--panel2:#2a142a;
  --glow:#ff2d9b;--mid:#e0629a;--soft:#f4b8d4;--pale:#fce4ec;
  --sql:#fce4ec;--sqd:#ad1457;
  --sel:rgba(255,235,59,.55);--dot:rgba(0,229,255,.70);
  --cap:rgba(0,229,255,.55);--lm:rgba(118,255,3,.30);--chk:rgba(255,23,68,.65);
  --text:#fce4ec;--muted:#b06080;
  --sq:58px;
}
@media(max-width:500px){:root{--sq:43px;}}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 60%,#7b004455 0%,transparent 70%),
    radial-gradient(ellipse 50% 35% at 85% 25%,#c0446e22 0%,transparent 65%);
}

.screen{display:none;position:relative;z-index:1;width:100%;flex-direction:column;align-items:center;}
.screen.active{display:flex;}

header{position:relative;z-index:1;text-align:center;padding:18px 0 8px;}
header h1{
  font-size:2.1rem;font-weight:900;letter-spacing:3px;
  background:linear-gradient(120deg,var(--soft),var(--glow),var(--mid));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
header p{color:var(--muted);font-size:.82rem;}

/* LOBBY */
#lobby{gap:14px;padding:14px;justify-content:center;min-height:75vh;}
.card{
  background:var(--panel);border:1px solid #5a1a3a;border-radius:18px;
  padding:22px;width:100%;max-width:370px;box-shadow:0 0 28px #c0446e22;
}
.card h2{font-size:1.1rem;color:var(--soft);margin-bottom:14px;text-align:center;}
.field{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
input[type=text],select{
  background:#2e1020;border:1px solid #5a1a3a;border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.93rem;
  outline:none;transition:.2s;text-align:center;
}
input[type=text]:focus,select:focus{border-color:var(--glow);box-shadow:0 0 10px #ff2d9b33;}
select{cursor:pointer;}
.btn{
  width:100%;padding:10px;border-radius:11px;border:none;
  font-family:'Tajawal',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;transition:.2s;
}
.btn-p{background:linear-gradient(135deg,#c0446e,var(--glow));color:#fff;box-shadow:0 3px 16px #c0446e44;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 6px 20px #c0446e66;}
.btn-s{background:transparent;color:var(--mid);border:1px solid #5a1a3a;}
.btn-s:hover{background:#2e1020;color:var(--soft);}
.divider{display:flex;align-items:center;gap:10px;margin:6px 0;color:#5a1a3a;font-size:.8rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#3a1228;}
.code-box{
  background:#2e1020;border:2px dashed var(--glow);border-radius:12px;
  padding:12px;font-size:2.2rem;font-weight:900;letter-spacing:10px;
  color:var(--glow);text-align:center;margin:10px 0;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 8px #ff2d9b22;}50%{box-shadow:0 0 22px #ff2d9b55;}}
.waiting-txt::after{content:'';animation:dots 1.4s infinite;}
@keyframes dots{0%{content:'';}33%{content:'.';}66%{content:'..';}100%{content:'...'}}

/* GAME */
#game{padding:7px;gap:7px;align-items:center;}

.strip{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid #3a1228;border-radius:12px;
  padding:8px 13px;width:100%;max-width:calc(var(--sq)*8 + 24px);transition:.3s;
}
.strip.active{border-color:var(--glow);box-shadow:0 0 14px #ff2d9b33;}
.strip .ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.strip .pname{font-weight:700;font-size:.88rem;flex:1;}
.strip .adv{font-size:.78rem;color:var(--mid);}
.strip .clk{font-size:.82rem;color:var(--muted);}

.captured{
  display:flex;flex-wrap:wrap;gap:1px;align-items:center;
  min-height:20px;font-size:.95rem;line-height:1;
  padding:3px 8px;background:var(--panel2);border-radius:8px;
  width:100%;max-width:calc(var(--sq)*8 + 24px);
}
.captured label{font-size:.62rem;color:var(--muted);margin-left:5px;}

/* Board layout */
.board-outer{display:flex;flex-direction:column;align-items:center;}
.board-row{display:flex;align-items:center;}
.file-labels{
  display:flex;padding:0 20px;
  width:calc(var(--sq)*8 + 40px);
}
.file-labels span{
  font-size:.58rem;color:var(--muted);font-weight:700;
  width:var(--sq);text-align:center;
}
.rank-labels{
  display:flex;flex-direction:column;width:20px;
}
.rank-labels span{
  font-size:.58rem;color:var(--muted);font-weight:700;
  height:var(--sq);display:flex;align-items:center;justify-content:center;
}

#board{
  display:grid;
  grid-template-columns:repeat(8,var(--sq));
  grid-template-rows:repeat(8,var(--sq));
  border:3px solid #7b1a4a;border-radius:5px;overflow:hidden;
  box-shadow:0 0 50px #c0446e44,0 0 100px #7b1a4a22;
}

.sq{
  width:var(--sq);height:var(--sq);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:background .1s;
}
.sq.light{background:var(--sql);}
.sq.dark {background:var(--sqd);}
.sq.sel  {background:var(--sel)!important;}
.sq.lm   {background:var(--lm)!important;}
.sq.chk  {background:var(--chk)!important;}
.sq.dot::after{
  content:'';position:absolute;width:32%;height:32%;
  background:var(--dot);border-radius:50%;pointer-events:none;
}
.sq.cap-ring::after{
  content:'';position:absolute;inset:3px;border-radius:50%;
  border:3px solid var(--cap);pointer-events:none;
}
.piece-img{
  width:88%;height:88%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.55));transition:transform .1s;
}
.sq:hover .piece-img{transform:scale(1.08);}
.piece-uni{
  font-size:calc(var(--sq) * .56);
  line-height:1;pointer-events:none;user-select:none;
}

.status{
  background:var(--panel);border:1px solid #3a1228;border-radius:11px;
  padding:8px 18px;font-size:.86rem;color:var(--soft);
  text-align:center;width:100%;max-width:calc(var(--sq)*8 + 24px);
}
.status.chk{border-color:#ff1744;color:#ff6090;}
.status.mat{border-color:var(--glow);color:var(--glow);font-weight:900;}

.history{
  background:var(--panel);border:1px solid #3a1228;border-radius:11px;
  padding:7px 12px;width:100%;max-width:calc(var(--sq)*8 + 24px);
  max-height:68px;overflow-y:auto;font-size:.73rem;
}
.history::-webkit-scrollbar{width:3px;}
.history::-webkit-scrollbar-thumb{background:#5a1a3a;border-radius:2px;}
.mv-list{display:flex;flex-wrap:wrap;gap:3px;}
.mv{background:#2e1020;border-radius:4px;padding:2px 5px;font-size:.7rem;}
.mv.w{color:var(--pale);}
.mv.b{color:#999;}

.ctrls{display:flex;gap:8px;width:100%;max-width:calc(var(--sq)*8 + 24px);}
.ctrls .btn{flex:1;padding:9px;font-size:.83rem;}
.room-foot{font-size:.68rem;color:#4a1a3a;text-align:center;margin-top:2px;}

/* overlays */
#go-overlay{
  display:none;position:fixed;inset:0;background:#000a;z-index:200;
  align-items:center;justify-content:center;
}
#go-overlay.show{display:flex;animation:fadein .3s;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.go-card{
  background:var(--panel);border:2px solid var(--glow);border-radius:20px;
  padding:34px;text-align:center;max-width:290px;width:88%;
  box-shadow:0 0 60px #ff2d9b55;
}
.go-card .ico{font-size:2.8rem;margin-bottom:9px;}
.go-card h2{font-size:1.45rem;color:var(--glow);margin-bottom:6px;}
.go-card p{color:var(--mid);margin-bottom:20px;}
#promo-modal{
  display:none;position:fixed;inset:0;background:#000c;z-index:300;
  align-items:center;justify-content:center;
}
#promo-modal.show{display:flex;}
.promo-card{
  background:var(--panel);border:2px solid #7b1a4a;border-radius:16px;
  padding:20px;text-align:center;box-shadow:0 0 40px #c0446e44;
}
.promo-card h3{color:var(--soft);margin-bottom:12px;}
.promo-row{display:flex;gap:10px;justify-content:center;}
.promo-btn{
  width:56px;height:56px;border-radius:11px;
  border:2px solid #5a1a3a;background:#2e1020;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;transition:.2s;
}
.promo-btn:hover{border-color:var(--glow);transform:scale(1.1);}
</style>
</head>
<body>

<header>
  <h1>♟ شطرنج ♟</h1>
  <p>ضد بوت أو ضد صاحبك</p>
</header>

<!-- LOBBY -->
<div id="lobby" class="screen active">

  <div class="card">
    <h2>🤖 ضد البوت</h2>
    <div class="field">
      <input type="text" id="bot-name" placeholder="اسمك" maxlength="20">
      <select id="bot-color">
        <option value="w">أنا الأبيض ⚪</option>
        <option value="b">أنا الأسود ⚫</option>
        <option value="r">عشوائي 🎲</option>
      </select>
      <select id="bot-diff">
        <option value="1">سهل 🌸</option>
        <option value="3" selected>متوسط ⚔️</option>
        <option value="5">صعب 💀</option>
      </select>
    </div>
    <button class="btn btn-p" onclick="startBot()">العب ضد البوت</button>
  </div>

  <div class="divider">أو</div>

  <div class="card" id="online-card">
    <h2>👥 أونلاين مع صاحبك</h2>
    <div class="field">
      <input type="text" id="create-name" placeholder="اسمك" maxlength="20">
    </div>
    <button class="btn btn-p" onclick="createRoom()">إنشاء غرفة</button>
    <div class="divider">أو انضم</div>
    <div class="field">
      <input type="text" id="join-name" placeholder="اسمك" maxlength="20">
      <input type="text" id="join-code" placeholder="كود الغرفة" maxlength="4"
        style="letter-spacing:8px;text-align:center;font-size:1.3rem;">
    </div>
    <button class="btn btn-s" onclick="joinRoom()">انضم للغرفة</button>
  </div>

  <div id="waiting-card" class="card" style="display:none;text-align:center;">
    <h2>⏳ انتظار صاحبك</h2>
    <p style="color:var(--muted);margin-bottom:6px;">شارك الكود ده:</p>
    <div class="code-box" id="code-display"></div>
    <p class="waiting-txt" style="color:var(--muted);margin-top:10px;">جاري الانتظار</p>
    <button class="btn btn-s" style="margin-top:14px;" onclick="location.reload()">إلغاء</button>
  </div>

</div>

<!-- GAME -->
<div id="game" class="screen">

  <div class="strip" id="strip-top">
    <div class="ava" id="ava-top">⚫</div>
    <div style="flex:1">
      <div class="pname" id="name-top">خصمك</div>
      <div class="adv" id="adv-top"></div>
    </div>
  </div>

  <div class="captured" id="cap-top"><label>التقط:</label></div>

  <!-- Board -->
  <div class="board-outer">
    <div class="file-labels" id="fl-top"></div>
    <div class="board-row">
      <div class="rank-labels" id="rl-left"></div>
      <div id="board"></div>
    </div>
    <div class="file-labels" id="fl-bot"></div>
  </div>

  <div class="captured" id="cap-bot"><label>التقط:</label></div>

  <div class="strip" id="strip-bot">
    <div class="ava" id="ava-bot">⚪</div>
    <div style="flex:1">
      <div class="pname" id="name-bot">أنت</div>
      <div class="adv" id="adv-bot"></div>
    </div>
  </div>

  <div class="status" id="status">...</div>
  <div class="history"><div class="mv-list" id="mv-list"></div></div>

  <div class="ctrls">
    <button class="btn btn-s" id="btn-draw" onclick="offerDraw()">تعادل</button>
    <button class="btn btn-s" onclick="resignGame()">استسلام</button>
    <button class="btn btn-p" onclick="location.reload()">جديد</button>
  </div>
  <div class="room-foot" id="room-foot"></div>

</div>

<!-- Game Over -->
<div id="go-overlay">
  <div class="go-card">
    <div class="ico" id="go-ico">🏆</div>
    <h2 id="go-title">نهاية</h2>
    <p id="go-msg"></p>
    <button class="btn btn-p" onclick="location.reload()">لعبة جديدة</button>
  </div>
</div>

<!-- Promotion -->
<div id="promo-modal">
  <div class="promo-card">
    <h3>اختر القطعة</h3>
    <div class="promo-row" id="promo-row"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   ASSETS
═══════════════════════════════════════ */
const IMG={
  K:'assets/chess/white/K.png',Q:'assets/chess/white/Q.png',
  R:'assets/chess/white/R.png',B:'assets/chess/white/B.png',
  N:'assets/chess/white/N.png',P:'assets/chess/white/P.png',
  k:'assets/chess/black/K.png',q:'assets/chess/black/Q.png',
  r:'assets/chess/black/R.png',b:'assets/chess/black/B.png',
  n:'assets/chess/black/N.png',p:'assets/chess/black/P.png',
};
const UNI={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const PVAL={p:1,n:3,b:3,r:5,q:9,k:0};

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let chess   = new Chess();
let myColor = 'w';   // 'w'|'b'|null(local both)
let myName  = 'أنت';
let oppName = 'الخصم';
let isBot   = false;
let botDepth= 3;
let isDone  = false;
let selSq   = null;
let hints   = [];
let lastMv  = [];
let pendPro = null;
let ch      = null;  // BroadcastChannel
let roomId  = null;
let isHost  = false;

/* ═══════════════════════════════════════
   LOBBY
═══════════════════════════════════════ */
function startBot(){
  myName = document.getElementById('bot-name').value.trim()||'أنت';
  let col= document.getElementById('bot-color').value;
  if(col==='r') col=Math.random()<.5?'w':'b';
  myColor=col; isBot=true;
  botDepth=parseInt(document.getElementById('bot-diff').value);
  const diffs=['سهل 🌸','','متوسط ⚔️','','صعب 💀'];
  oppName=diffs[botDepth-1]+' 🤖';
  document.getElementById('btn-draw').style.display='none';
  startGame();
  if(myColor==='b') setTimeout(botMove,400);
}

function createRoom(){
  const name=document.getElementById('create-name').value.trim()||'لاعب ١';
  roomId=Math.floor(1000+Math.random()*9000).toString();
  isHost=true; myColor='w'; myName=name;
  ch=new BroadcastChannel('chess_'+roomId);
  ch.onmessage=onMsg;
  document.getElementById('online-card').style.display='none';
  document.getElementById('waiting-card').style.display='block';
  document.getElementById('code-display').textContent=roomId;
}

function joinRoom(){
  const name=document.getElementById('join-name').value.trim()||'لاعب ٢';
  const code=document.getElementById('join-code').value.trim();
  if(code.length!==4){alert('أدخل كود ٤ أرقام');return;}
  roomId=code; isHost=false; myColor='b'; myName=name;
  ch=new BroadcastChannel('chess_'+roomId);
  ch.onmessage=onMsg;
  ch.postMessage({type:'join',name});
}

/* ═══════════════════════════════════════
   NETWORK
═══════════════════════════════════════ */
function onMsg(e){
  const d=e.data;
  if(d.type==='join'){
    oppName=d.name; startGame();
    ch.postMessage({type:'start',hostName:myName,guestName:d.name});
  }
  else if(d.type==='start'){
    oppName=d.hostName; startGame();
  }
  else if(d.type==='move'){
    chess.move({from:d.from,to:d.to,promotion:d.promo||'q'});
    selSq=null; hints=[]; lastMv=[d.from,d.to];
    render(); refreshStatus(); checkEnd();
  }
  else if(d.type==='resign'){
    endGame('🏆',`${d.name} استسلم!`,`فاز ${myName}! 🎉`);
  }
  else if(d.type==='draw_offer'){
    if(confirm(`${d.name} يعرض التعادل. توافق؟`)){
      ch.postMessage({type:'draw_accept'});
      endGame('🤝','تعادل!','اتفق اللاعبان');
    }
  }
  else if(d.type==='draw_accept') endGame('🤝','تعادل!','اتفق اللاعبان');
}

/* ═══════════════════════════════════════
   GAME INIT
═══════════════════════════════════════ */
function startGame(){
  chess.reset(); isDone=false; selSq=null; hints=[]; lastMv=[];
  document.getElementById('lobby').classList.remove('active');
  document.getElementById('game').classList.add('active');

  // Orientation: I'm always at bottom.
  // myColor='w' → I'm white → white pieces at bottom, black at top
  // myColor='b' → I'm black → black pieces at bottom, white at top
  const meIsW=(myColor==='w'||myColor===null);
  document.getElementById('ava-bot').textContent=meIsW?'⚪':'⚫';
  document.getElementById('ava-top').textContent=meIsW?'⚫':'⚪';
  document.getElementById('name-bot').textContent=myName;
  document.getElementById('name-top').textContent=oppName;

  if(roomId) document.getElementById('room-foot').textContent=
    `غرفة: ${roomId} | أنت: ${meIsW?'⚪':'⚫'} ${myName}`;

  buildCoords();
  render();
  refreshStatus();
}

/* ═══════════════════════════════════════
   COORDINATES
═══════════════════════════════════════ */
function buildCoords(){
  const flip=(myColor==='b');
  // files: a→h normal, h→a flipped
  const files=flip?['h','g','f','e','d','c','b','a']:['a','b','c','d','e','f','g','h'];
  // ranks: 8→1 top-to-bottom normal; 1→8 if flipped
  const ranks=flip?['1','2','3','4','5','6','7','8']:['8','7','6','5','4','3','2','1'];

  ['fl-top','fl-bot'].forEach(id=>{
    const el=document.getElementById(id); el.innerHTML='';
    // empty spacer for rank labels
    const sp=document.createElement('span'); sp.style.width='20px'; el.appendChild(sp);
    files.forEach(f=>{ const s=document.createElement('span'); s.textContent=f; el.appendChild(s); });
  });
  const rl=document.getElementById('rl-left'); rl.innerHTML='';
  ranks.forEach(r=>{ const s=document.createElement('span'); s.textContent=r; rl.appendChild(s); });
}

/* ═══════════════════════════════════════
   RENDER BOARD
═══════════════════════════════════════ */
function render(){
  const el=document.getElementById('board'); el.innerHTML='';
  const flip=(myColor==='b');

  // Find king in check
  let chkSq=null;
  if(chess.in_check()){
    const turn=chess.turn();
    chess.board().forEach((row,ri)=>row.forEach((p,ci)=>{
      if(p&&p.type==='k'&&p.color===turn)
        chkSq='abcdefgh'[ci]+(8-ri);
    }));
  }

  for(let ri=0;ri<8;ri++){
    for(let ci=0;ci<8;ci++){
      const row=flip?7-ri:ri;
      const col=flip?7-ci:ci;
      const sq='abcdefgh'[col]+(8-row);

      const cell=document.createElement('div');
      cell.className='sq '+((row+col)%2===0?'light':'dark');
      cell.dataset.sq=sq;

      if(sq===selSq)            cell.classList.add('sel');
      if(lastMv.includes(sq))   cell.classList.add('lm');
      if(sq===chkSq)            cell.classList.add('chk');
      if(hints.includes(sq)){
        cell.classList.add(chess.get(sq)?'cap-ring':'dot');
      }

      const piece=chess.get(sq);
      if(piece){
        const code=piece.color==='w'?piece.type.toUpperCase():piece.type;
        const img=document.createElement('img');
        img.src=IMG[code]; img.className='piece-img'; img.alt=code;
        img.onerror=function(){
          this.remove();
          const s=document.createElement('span');
          s.className='piece-uni'; s.textContent=UNI[code];
          cell.appendChild(s);
        };
        cell.appendChild(img);
      }

      cell.addEventListener('click',()=>clickSq(sq));
      el.appendChild(cell);
    }
  }

  renderCaptures();
  renderHistory();
  updateStrips();
}

/* ═══════════════════════════════════════
   SQUARE CLICK
═══════════════════════════════════════ */
function clickSq(sq){
  if(isDone) return;
  // Turn check
  const turn=chess.turn();
  if(myColor!==null && turn!==myColor) return;
  if(isBot && turn!==myColor) return;

  const piece=chess.get(sq);

  if(selSq){
    if(hints.includes(sq)){
      doMove(selSq,sq); return;
    }
    if(piece&&piece.color===turn){
      selSq=sq;
      hints=chess.moves({square:sq,verbose:true}).map(m=>m.to);
      render(); return;
    }
    selSq=null; hints=[]; render(); return;
  }

  if(piece&&piece.color===turn){
    selSq=sq;
    hints=chess.moves({square:sq,verbose:true}).map(m=>m.to);
    render();
  }
}

function doMove(from,to,promo){
  const isProm=chess.moves({square:from,verbose:true})
    .filter(m=>m.to===to).some(m=>m.flags.includes('p'));
  if(isProm&&!promo){
    pendPro={from,to};
    showPromo(chess.turn()); return;
  }
  const result=chess.move({from,to,promotion:promo||'q'});
  if(!result) return;
  lastMv=[from,to]; selSq=null; hints=[];
  if(!isBot&&ch) ch.postMessage({type:'move',from,to,promo:promo||null});
  render(); refreshStatus(); checkEnd();
  if(isBot&&!isDone) setTimeout(botMove,380);
}

/* ═══════════════════════════════════════
   PROMOTION
═══════════════════════════════════════ */
function showPromo(color){
  const modal=document.getElementById('promo-modal');
  const row=document.getElementById('promo-row'); row.innerHTML='';
  const pieces=color==='w'?['Q','R','B','N']:['q','r','b','n'];
  pieces.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='promo-btn';
    const img=document.createElement('img');
    img.src=IMG[p]; img.style='width:44px;height:44px;object-fit:contain;';
    img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('span'),
      {textContent:UNI[p],style:'font-size:1.8rem'}));};
    btn.appendChild(img);
    btn.onclick=()=>{
      modal.classList.remove('show');
      const{from,to}=pendPro; pendPro=null;
      doMove(from,to,p.toLowerCase());
    };
    row.appendChild(btn);
  });
  modal.classList.add('show');
}

/* ═══════════════════════════════════════
   BOT  (Minimax + Alpha-Beta)
═══════════════════════════════════════ */
const PSQ={
  p:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,
     5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,
     5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
  n:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,
     -30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,
     -30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,
     -40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
  b:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,
     -10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,
     -10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,
     -10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
  r:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,
     -5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,
     -5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
  q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,
     -10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,
     0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,
     -10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
  k:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,
     -30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,
     -20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,
     20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20]
};

function evalBoard(){
  let s=0;
  chess.board().forEach((row,ri)=>row.forEach((p,ci)=>{
    if(!p) return;
    const val=(PVAL[p.type]||0)*100;
    const idx=p.color==='w'?ri*8+ci:(7-ri)*8+ci;
    const ps=(PSQ[p.type]||[])[idx]||0;
    s+=p.color==='w'?val+ps:-(val+ps);
  }));
  return s;
}

function minimax(depth,alpha,beta,maxing){
  if(depth===0||chess.game_over()) return evalBoard();
  const moves=chess.moves();
  if(maxing){
    let best=-Infinity;
    for(const m of moves){
      chess.move(m);
      best=Math.max(best,minimax(depth-1,alpha,beta,false));
      chess.undo(); alpha=Math.max(alpha,best);
      if(beta<=alpha) break;
    }
    return best;
  }else{
    let best=Infinity;
    for(const m of moves){
      chess.move(m);
      best=Math.min(best,minimax(depth-1,alpha,beta,true));
      chess.undo(); beta=Math.min(beta,best);
      if(beta<=alpha) break;
    }
    return best;
  }
}

function botMove(){
  if(isDone||chess.game_over()) return;
  const botCol=myColor==='w'?'b':'w';
  const maxing=botCol==='w';
  const moves=chess.moves({verbose:true});
  if(!moves.length) return;

  // Add slight randomness for easier levels
  const jitter=botDepth===1?80:botDepth===3?15:0;

  let best=null,bestScore=maxing?-Infinity:Infinity;
  for(const m of moves){
    chess.move(m);
    const score=minimax(botDepth-1,-Infinity,Infinity,!maxing)+(Math.random()*jitter-jitter/2);
    chess.undo();
    if(maxing?score>bestScore:score<bestScore){bestScore=score;best=m;}
  }
  if(best){
    chess.move(best);
    lastMv=[best.from,best.to]; selSq=null; hints=[];
    render(); refreshStatus(); checkEnd();
  }
}

/* ═══════════════════════════════════════
   STATUS & UI
═══════════════════════════════════════ */
function refreshStatus(){
  const bar=document.getElementById('status');
  if(chess.in_checkmate()){
    const w=chess.turn()==='w'?'الأسود':'الأبيض';
    bar.textContent=`👑 كش مات! فاز ${w}`;
    bar.className='status mat'; return;
  }
  if(chess.in_stalemate()){bar.textContent='🤝 وقفة! تعادل';bar.className='status mat';return;}
  if(chess.in_draw()){bar.textContent='🤝 تعادل';bar.className='status mat';return;}
  if(chess.in_check()){
    const t=chess.turn()==='w'?'الأبيض ⚪':'الأسود ⚫';
    bar.textContent=`⚠️ كش! دور ${t}`;bar.className='status chk';return;
  }
  const myTurn=myColor===null||chess.turn()===myColor;
  if(isBot){
    bar.textContent=myTurn?'↩ دورك! اختر قطعة':'🤖 البوت يفكر...';
  } else {
    const t=chess.turn()==='w'?'الأبيض ⚪':'الأسود ⚫';
    bar.textContent=myTurn?'↩ دورك!': `⏳ دور ${t}`;
  }
  bar.className='status';
}

function updateStrips(){
  const turn=chess.turn();
  const myIsW=(myColor==='w'||myColor===null);
  // bottom strip active when it's my turn
  const botActive=(myColor===null)||(turn===myColor);
  document.getElementById('strip-bot').className='strip'+(botActive?' active':'');
  document.getElementById('strip-top').className='strip'+(!botActive?' active':'');
}

function renderCaptures(){
  const hist=chess.history({verbose:true});
  const capW=[],capB=[];
  hist.forEach(m=>{ if(m.captured){ if(m.color==='w') capW.push(m.captured); else capB.push(m.captured); } });

  const meIsW=(myColor==='w'||myColor===null);
  // top player's captures = pieces taken by opponent
  const topCap=meIsW?capB:capW;
  const botCap=meIsW?capW:capB;

  const fmt=arr=>arr.map(t=>UNI[t]||t).join('');
  document.getElementById('cap-top').innerHTML=`<label>التقط:</label> ${fmt(topCap)}`;
  document.getElementById('cap-bot').innerHTML=`<label>التقط:</label> ${fmt(botCap)}`;

  // Material advantage
  const wVal=capW.reduce((s,t)=>s+(PVAL[t]||0),0);
  const bVal=capB.reduce((s,t)=>s+(PVAL[t]||0),0);
  const diff=wVal-bVal;
  document.getElementById('adv-bot').textContent=(meIsW&&diff>0)||(!meIsW&&diff<0)?`+${Math.abs(diff)}`:'';
  document.getElementById('adv-top').textContent=(!meIsW&&diff>0)||(meIsW&&diff<0)?`+${Math.abs(diff)}`:'';
}

function renderHistory(){
  const el=document.getElementById('mv-list');
  el.innerHTML='';
  chess.history().forEach((m,i)=>{
    const s=document.createElement('span');
    s.className='mv '+(i%2===0?'w':'b');
    s.textContent=(i%2===0?`${Math.floor(i/2)+1}. `:'')+m;
    el.appendChild(s);
  });
  el.parentElement.scrollTop=9999;
}

function checkEnd(){
  if(chess.in_checkmate()){
    const w=chess.turn()==='w'?'الأسود':'الأبيض';
    endGame('👑','كش مات!',`فاز ${w} 🎉`);
  } else if(chess.in_stalemate()||chess.in_draw()||chess.in_threefold_repetition()){
    endGame('🤝','تعادل!',chess.in_stalemate()?'وقفة - لا حركات':'بالقواعد أو التكرار');
  }
}

function endGame(ico,title,msg){
  isDone=true;
  document.getElementById('go-ico').textContent=ico;
  document.getElementById('go-title').textContent=title;
  document.getElementById('go-msg').textContent=msg;
  document.getElementById('go-overlay').classList.add('show');
}

function resignGame(){
  if(isDone) return;
  if(!confirm('تستسلم؟')) return;
  const winner=myColor==='w'?'الأسود':'الأبيض';
  if(ch) ch.postMessage({type:'resign',name:myName});
  endGame('🏳️','استسلمت!',`فاز ${winner}`);
}

function offerDraw(){
  if(isDone||!ch) return;
  ch.postMessage({type:'draw_offer',name:myName});
  alert('تم إرسال عرض التعادل...');
}
